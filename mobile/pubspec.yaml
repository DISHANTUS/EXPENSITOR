name: expensitor_mobile
description: Expensitor mobile client — exposes the existing advisor backend.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.2.2
  table_calendar: ^3.1.2
  url_launcher: ^6.3.0
  fl_chart: ^0.69.0
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  confetti: ^0.8.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    # Bundled starter fact packs so the companion always has facts offline. New
    # files added to this folder are picked up automatically (no pubspec change).
    - assets/facts/
