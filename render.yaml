# Render Blueprint for the Advary/Expensitor API.
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Render reads this file.
# The database is Neon (external) — set the POSTGRES_* secrets below from your Neon
# project's *direct* connection details. Neon is not provisioned by this file.
services:
  - type: web
    name: expensitor-api
    runtime: docker
    repo: https://github.com/DISHANTUS/EXPENSITOR
    branch: beta-prep           # the beta candidate; switch to main after you merge
    # Paths are relative to the REPO ROOT (not a rootDir). The app lives in backend/.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore           # pick the region closest to your users
    plan: free                  # free tier; spins down when idle (~50s cold start). Use 'starter' for always-on.
    healthCheckPath: /api/v1/health
    autoDeploy: true
    # Migrations + idempotent seeds + serve on $PORT, via a script (no shell-quoting
    # ambiguity — Render wraps the command in a shell itself).
    dockerCommand: sh start.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true     # Render generates a strong random secret
      - key: DB_SSL
        value: "true"           # Neon requires TLS
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: OLLAMA_ENABLED
        value: "false"          # no local model on Render; deterministic narration
      - key: DEFAULT_BASE_CURRENCY
        value: INR
      - key: POSTGRES_PORT
        value: "5432"
      # --- Set these from Neon (dashboard → secret; never commit them) ---
      - key: POSTGRES_SERVER
        sync: false             # e.g. ep-xxxx-xxxx.<region>.aws.neon.tech
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false             # use a password with no URL-special chars (@ : / ? #)
      - key: POSTGRES_DB
        sync: false
      # --- Developer backlog digest (OPTIONAL; leave unset and no mail is sent) ---
      # Tells the developer HOW MANY items are waiting for the local model — a
      # count, once a day, never anything a user wrote. See app/services/mail_service.py.
      # SMTP_PASSWORD is a Gmail *app password* (myaccount.google.com -> Security
      # -> 2-Step Verification -> App passwords), NOT the account password.
      # Set these in the Render dashboard; sync:false keeps them out of git.
      - key: SMTP_HOST
        sync: false             # smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false             # advary2006@gmail.com
      - key: SMTP_PASSWORD
        sync: false             # the 16-character app password, no spaces
      - key: SMTP_FROM
        sync: false             # advary2006@gmail.com
      # CORS is not needed for the native APK (dio). Add a JSON array only for a web client:
      # - key: BACKEND_CORS_ORIGINS
      #   value: '["https://your-web-app.example"]'
